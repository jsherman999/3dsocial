name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Rebuild rather than trusting the committed copy, so the published page
      # always matches data.json even if someone edits it without rerunning.
      - run: python export.py -o index.html

      # Turning Pages on for the first time needs a repo-settings permission the
      # workflow token doesn't have, so this can't self-enable. Rather than
      # red-X every push until someone flips the switch, the deploy steps below
      # sit out until Pages is on. Settings -> Pages -> Source: GitHub Actions.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - if: steps.pages.outcome != 'success'
        run: |
          echo "::notice::Pages is not enabled for this repo, so nothing was deployed."
          echo "::notice::Enable it at Settings -> Pages -> Source: GitHub Actions, then re-run."

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
